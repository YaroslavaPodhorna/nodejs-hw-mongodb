tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve all contacts belonging to the user. You can filter using query parameters.
security:
  - bearerAuth: []
parameters:
  - name: isFavourite
    in: query
    required: false
    schema:
      type: boolean
  - name: contactType
    in: query
    required: false
    schema:
      type: string
      enum: [work, home, personal]
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - data
          properties:
            status:
              type: integer
              example: 200
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'

  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
