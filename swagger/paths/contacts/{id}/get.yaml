tags:
  - Contacts
summary: Get contact by ID
operationId: getContact
description: Get a contact by its unique identifier.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
    example: '681da1369942e479a238a942'
responses:
  '200':
    description: Contact retrieved successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 681da1369942e479a238a942!
            data:
              $ref: '../../../components/schemas/contact.yaml'

  '401':
    $ref: '../../../components/responses/401.yaml'

  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found!

  '500':
    $ref: '../../../components/responses/500.yaml'
