type: object
required:
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  name:
    type: string
    example: John Doe

  phoneNumber:
    type: string
    example: '+1234567890'

  email:
    type: string
    format: email
    description: Contact email address
    example: 'john.doe@example.com'

  isFavourite:
    type: boolean
    example: false
    default: false

  contactType:
    type: string
    enum: [work, home, personal]
    example: personal
    default: personal

  userId:
    type: string
    format: uuid
    example: '60f7f9dfe5c8e92f54f48b57'

  photo:
    type: string
    format: uri
    description: Contact photo URL
    example: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'

  createdAt:
    type: string
    format: date-time
    readOnly: true

  updatedAt:
    type: string
    format: date-time
    readOnly: true
